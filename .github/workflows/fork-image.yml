# Builds the tailored fork image for the self-hosted VM (amd64 only).
# Pulled by the VM's wf-update as ghcr.io/andrerovira/wealthfolio:tailored.
name: Fork image

on:
  push:
    branches: [tailored]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/andrerovira/wealthfolio:tailored
            ghcr.io/andrerovira/wealthfolio:sha-${{ github.sha }}
          # Upstream's public dependency cache first, then this fork's own layer cache.
          cache-from: |
            type=registry,ref=ghcr.io/afadil/wealthfolio-build-cache:deps-amd64
            type=gha
          cache-to: type=gha,mode=max
