# Weekly: how far is the tailored branch behind the newest upstream release?
# Opens or updates one issue so the rebase does not get forgotten.
name: Upstream check

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 08:00 CDMX
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tailored
          fetch-depth: 0
      - name: Compare with upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote add upstream https://github.com/afadil/wealthfolio.git
          git fetch -q upstream --tags
          base=$(git describe --tags --abbrev=0 --match 'v*' $(git merge-base HEAD upstream/main))
          latest=$(git tag -l 'v*' --sort=-v:refname | grep -v -- '-' | head -1)
          [ "$base" = "$latest" ] && { echo "tailored is on $base, nothing new"; exit 0; }
          body=$(printf 'tailored is based on %s, newest upstream release is %s.\n\nRebase: `git rebase --onto %s %s tailored`\n\nRelease notes: https://github.com/afadil/wealthfolio/releases/tag/%s' "$base" "$latest" "$latest" "$base" "$latest")
          n=$(gh issue list --label upstream --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue edit "$n" --title "Upstream $latest available" --body "$body";
          else gh issue create --label upstream --title "Upstream $latest available" --body "$body"; fi
